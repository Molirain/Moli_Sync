# MoliSync server — Docker Compose example.
#
# This file is a template. Copy it to docker-compose.yml before use:
#
#   cp docker-compose.example.yml docker-compose.yml
#   docker compose up -d
#
# Only the Go control plane is defined here. Your existing reverse proxy
# (Nginx, NPM, Caddy, ...) must join the "molisync-internal" network, terminate
# mTLS, and forward the verified identity headers. Do not publish port 9520 to
# the host or the internet.

name: molisync

services:
  server:
    # Release images are built by .github/workflows/server-image.yml.
    # "latest" follows the default branch and is rebuilt on every server
    # release. Pin a tag when you want reproducible upgrades, for example
    # ghcr.io/molirain/molisync-server:0.5.1 (the tag matches the
    # server-v0.5.1 release).
    # To build from this checkout instead, comment out "image" and uncomment
    # "build" below.
    image: ghcr.io/molirain/molisync-server:latest
    # build:
    #   context: ./server

    container_name: molisync-server
    restart: unless-stopped

    environment:
      # Listen on all interfaces inside the container; the port is only
      # reachable over the private Compose network.
      MOLISYNC_SERVER_LISTEN: "0.0.0.0:9520"

      # Only the reverse proxy may talk to this service. Keep this equal to the
      # "molisync-internal" subnet and do not attach other containers to it:
      # any peer in this range can assert an mTLS identity.
      MOLISYNC_PROXY_TRUSTED_CIDRS: "172.28.0.0/24"

      # Headers the proxy must set from the verified client certificate.
      MOLISYNC_PROXY_VERIFY_HEADER: "X-Client-Verify"
      MOLISYNC_PROXY_FINGERPRINT_HEADER: "X-Client-Fingerprint"
      MOLISYNC_PROXY_DN_HEADER: "X-Client-DN"
      MOLISYNC_PROXY_REQUIRED_VERIFY_VALUE: "SUCCESS"

      # Nginx cannot compute a SHA-256 digest ($ssl_client_fingerprint is
      # SHA-1). Forward the whole certificate instead and let the server hash
      # it; without this, P2P cannot pin the peer and always uses the relay.
      # nginx: proxy_set_header X-Client-Cert $ssl_client_escaped_cert;
      # MOLISYNC_PROXY_CERT_HEADER: "X-Client-Cert"
      # Mount the same CA into this container to have the server verify the
      # chain as well (recommended):
      # MOLISYNC_PROXY_CLIENT_CA_FILE: "/etc/molisync/client-ca.crt"

      # "fingerprint" (recommended) or "dn_cn".
      MOLISYNC_AUTH_DEVICE_ID_SOURCE: "fingerprint"

      # Durable storage: SQLite database and blobs live on the named volume
      # below. MaxItemBytes caps a single cloud item; the client's 15 MiB
      # threshold decides when to use P2P instead.
      MOLISYNC_STORAGE_DATA_DIR: "/var/lib/molisync"
      MOLISYNC_STORAGE_MAX_ITEM_BYTES: "67108864"

      MOLISYNC_LOG_LEVEL: "info"
      MOLISYNC_LOG_FORMAT: "json"

      # Anonymous install counting: one POST per device, the first time it ever
      # connects. Only an opaque deployment-scoped id, the platform and the
      # server version are sent. Set MOLISYNC_TELEMETRY_ENABLED to "false" to
      # opt out.
      MOLISYNC_TELEMETRY_ENDPOINT: "https://statistics-api.molirain.com/install"
      # Only needed if the counter operator enables a bot filter.
      # MOLISYNC_TELEMETRY_TOKEN: "shared-report-token"

      # The server's own release lookup. Clients read the result through
      # /api/v1/me and warn when the server lags behind the latest
      # server-vX.Y.Z release. Harmless to disable for air-gapped hosts.
      MOLISYNC_UPDATE_CHECK_ENABLED: "true"
      MOLISYNC_UPDATE_CHECK_REPOSITORY: "Molirain/Moli_Sync"

    # No "ports": the proxy is the only ingress.
    expose:
      - "9520"

    # Optional YAML configuration. Environment variables still win over it.
    # volumes:
    #   - ./server/config.yaml:/config.yaml:ro
    # command: ["-config", "/config.yaml"]

    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    volumes:
      # SQLite database + blobs. This mount is what makes the records survive
      # an image update: without it the data lives in the container writable
      # layer and `docker compose up` after a pull deletes everything.
      # Removing the container keeps the records; `docker compose down -v`
      # intentionally deletes them.
      - molisync-data:/var/lib/molisync

    healthcheck:
      test:
        - CMD
        - /usr/local/bin/molisync-server
        - -healthcheck-url
        - http://127.0.0.1:9520/healthz
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    networks:
      - control

networks:
  control:
    name: molisync-internal
    driver: bridge
    ipam:
      config:
        # Must match MOLISYNC_PROXY_TRUSTED_CIDRS above.
        - subnet: 172.28.0.0/24

volumes:
  molisync-data:
    name: molisync-data
