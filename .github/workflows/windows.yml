name: Windows CI and release

on:
  pull_request:
    paths:
      - "client-windows/**"
      - ".github/workflows/windows.yml"
  push:
    branches:
      - main
      - master
    tags:
      - "desktop-v*"
    paths:
      - "client-windows/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: client-windows
        run: dotnet restore MoliSync.Client.sln

      - name: Test
        working-directory: client-windows
        run: dotnet test tests/MoliSync.Client.Tests/MoliSync.Client.Tests.csproj -c Release --nologo

  release:
    name: Publish portable build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("desktop-v")) {
            throw "unexpected tag $tag"
          }
          $version = $tag.Substring("desktop-v".Length)
          if ($version -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
            throw "invalid version $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish NativeAOT build
        working-directory: client-windows
        run: >
          dotnet publish src/MoliSync.Client/MoliSync.Client.csproj
          -c Release -r win-x64 --nologo
          -p:Version=${{ steps.version.outputs.value }}
          -p:InformationalVersion=${{ steps.version.outputs.value }}
          -o ${{ runner.temp }}/publish

      - name: Package portable archive
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $staging = Join-Path $env:RUNNER_TEMP "MoliSync-Windows-$version"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "${{ runner.temp }}/publish/*" $staging -Recurse
          Copy-Item "client-windows/README.md" $staging -ErrorAction SilentlyContinue
          $archive = Join-Path $env:RUNNER_TEMP "MoliSync-Windows-$version.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $archive -CompressionLevel Optimal
          "path=$archive" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "${{ steps.package.outputs.path }}" `
            --title "MoliSync Windows ${{ steps.version.outputs.value }}" `
            --generate-notes
